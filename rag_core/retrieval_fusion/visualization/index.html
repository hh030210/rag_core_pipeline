<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>检索结果可视化</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #182b3a;
      --muted: #6d7c87;
      --line: #dce5e9;
      --paper: #f3f7f7;
      --card: #fff;
      --teal: #087e83;
      --teal-soft: #e2f4f2;
      --blue: #4269a4;
      --blue-soft: #eaf0fb;
      --gold: #a56808;
      --gold-soft: #fff2d6;
      --red: #b04444;
      --red-soft: #fff0ed;
      --shadow: 0 8px 24px rgba(24, 43, 58, .06);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .topbar { background: #132c3a; color: #f5fbfb; padding: 23px clamp(18px, 3vw, 42px); }
    .topbar-inner { max-width: 1760px; margin: auto; display: flex; justify-content: space-between; align-items: center; gap: 18px; }
    h1 { margin: 0; font-size: 23px; letter-spacing: .02em; }
    .subtitle { margin-top: 5px; color: #b5cbd0; font-size: 13px; }
    .local-badge { flex: none; border: 1px solid #53737c; color: #cce8e6; border-radius: 999px; padding: 6px 11px; font-size: 12px; }
    .page { max-width: 1760px; margin: auto; padding: 22px clamp(14px, 2.2vw, 32px) 40px; }
    .metrics { display: grid; grid-template-columns: repeat(6, minmax(120px, 1fr)); gap: 11px; margin-bottom: 18px; }
    .metric { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 13px 15px; box-shadow: var(--shadow); min-height: 77px; }
    .metric-label { color: var(--muted); font-size: 12px; }
    .metric-value { margin-top: 3px; font-size: 23px; line-height: 1.2; font-weight: 720; font-variant-numeric: tabular-nums; }
    .metric-value.warn { color: var(--red); }
    .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 0 0 14px; }
    .search { flex: 1 1 300px; min-width: 220px; position: relative; }
    .search input, select { width: 100%; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; outline: none; }
    .search input:focus, select:focus { border-color: #68aeb0; box-shadow: 0 0 0 3px rgba(8,126,131,.1); }
    select { width: auto; min-width: 190px; }
    .button { background: white; color: var(--ink); border: 1px solid var(--line); border-radius: 9px; padding: 9px 12px; }
    .button:hover { border-color: #9cb7bd; }
    .button.primary { color: white; background: var(--teal); border-color: var(--teal); }
    .button.primary:hover { background: #066c71; }
    .layout { display: grid; grid-template-columns: minmax(250px, 310px) minmax(0, 1fr); gap: 15px; align-items: start; }
    .panel { background: var(--card); border: 1px solid var(--line); border-radius: 13px; box-shadow: var(--shadow); }
    .list-panel { overflow: hidden; position: sticky; top: 12px; max-height: calc(100vh - 24px); display: flex; flex-direction: column; }
    .list-heading { padding: 14px 15px 11px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; }
    .list-heading strong { font-size: 14px; }
    .list-heading span { color: var(--muted); font-size: 12px; }
    .question-list { overflow-y: auto; padding: 5px; }
    .question-item { display: block; width: 100%; text-align: left; color: var(--ink); background: transparent; border: 0; border-radius: 9px; padding: 10px; margin: 1px 0; }
    .question-item:hover { background: #f2f7f7; }
    .question-item.active { background: var(--teal-soft); box-shadow: inset 3px 0 var(--teal); }
    .question-item-title { font-size: 13px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .question-item-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; color: var(--muted); font-size: 11px; }
    .mini-state { border-radius: 999px; padding: 2px 7px; background: #edf1f3; color: #687780; }
    .mini-state.hit { background: var(--teal-soft); color: var(--teal); }
    .mini-state.lost { background: var(--red-soft); color: var(--red); }
    .mini-state.unrated { background: #edf1f3; color: #687780; }
    .detail { min-width: 0; padding: 19px; }
    .detail-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
    .question-title { margin: 0; font-size: 20px; line-height: 1.45; }
    .query-line { margin-top: 7px; color: var(--muted); font-size: 12px; }
    .navigation { display: flex; flex: none; gap: 7px; }
    .navigation .button { padding: 7px 10px; }
    .badges { display: flex; gap: 7px; flex-wrap: wrap; margin: 14px 0; }
    .badge { border-radius: 999px; padding: 4px 9px; background: #edf1f3; color: #5c6a74; font-size: 11px; }
    .badge.hit { background: var(--teal-soft); color: var(--teal); }
    .badge.miss { background: var(--red-soft); color: var(--red); }
    .badge.gold { background: var(--gold-soft); color: var(--gold); }
    .alert { display: none; background: var(--red-soft); border: 1px solid #f2d4ce; color: #8e3535; border-radius: 10px; padding: 10px 12px; margin: 0 0 15px; }
    .alert.visible { display: block; }
    .alert strong { font-weight: 700; }
    .routes { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; overflow-x: auto; padding-bottom: 5px; }
    .route { min-width: 190px; border: 1px solid var(--line); border-radius: 11px; overflow: hidden; background: #fff; }
    .route-head { min-height: 66px; padding: 10px 11px; background: #f8fafb; border-bottom: 1px solid var(--line); }
    .route-title { font-weight: 700; font-size: 13px; }
    .route-sub { margin-top: 3px; color: var(--muted); font-size: 11px; }
    .route-list { padding: 6px; }
    .candidate { border-radius: 8px; padding: 8px; margin: 3px 0; min-height: 58px; background: #fff; border: 1px solid transparent; }
    .candidate:hover { background: #f7f9fa; border-color: var(--line); }
    .candidate.is-gold { background: #fffaf0; border-color: #f1dcae; }
    .candidate.is-linked-hover { background: #d8efed; border-color: #55a9a8; box-shadow: inset 0 0 0 1px rgba(8,126,131,.16); }
    .candidate.is-dropped { box-shadow: inset 3px 0 var(--red); }
    .candidate-top { display: flex; justify-content: space-between; gap: 5px; align-items: center; }
    .rank { color: var(--muted); font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .candidate-flags { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
    .flag { font-size: 9px; line-height: 1.5; padding: 1px 5px; border-radius: 999px; color: var(--muted); background: #eef1f3; }
    .flag.gold { color: var(--gold); background: var(--gold-soft); }
    .flag.dropped { color: var(--red); background: var(--red-soft); }
    .chunk-id { margin-top: 5px; font: 10px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; color: #425663; overflow-wrap: anywhere; }
    .chunk-link { display: block; width: 100%; padding: 0; border: 0; background: transparent; text-align: left; cursor: pointer; }
    .chunk-link:hover { color: var(--teal); text-decoration: underline; }
    .question-dimensions { margin: 12px 0; padding: 12px; border: 1px solid #d9e5e7; border-radius: 11px; background: #f7fbfb; }
    .dimension-panel-title { margin: 0 0 9px; font-size: 13px; }
    .query-dimension-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(205px, 1fr)); gap: 7px; }
    .query-dimension { padding: 8px; border: 1px solid #e3ebed; border-radius: 8px; background: white; }
    .dimension-group-title { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-bottom: 5px; font-size: 11px; font-weight: 700; }
    .dimension-path { color: var(--muted); font-size: 10px; font-weight: 400; }
    .dimension-role { border-radius: 999px; padding: 1px 6px; color: #49626c; background: #eaf0f2; font-size: 9px; font-weight: 500; }
    .dimension-tags { display: flex; flex-wrap: wrap; gap: 4px; }
    .dimension-chip { display: inline-flex; flex-wrap: wrap; gap: 3px; align-items: center; padding: 3px 6px; border: 1px solid #dce8e9; border-radius: 6px; color: #31525a; background: #f6fbfa; font-size: 10px; overflow-wrap: anywhere; }
    .dimension-chip.intent { color: #755c32; border-color: #eee2c9; background: #fffaf0; }
    .dimension-chip-score { color: var(--teal); font-variant-numeric: tabular-nums; }
    .dimension-note { margin-top: 7px; color: var(--muted); font-size: 10px; }
    .dimension-card-info { margin-top: 7px; }
    .dimension-preview { display: flex; flex-wrap: wrap; gap: 3px; }
    .dimension-info { margin-top: 7px; padding-top: 5px; border-top: 1px dashed #d3dce0; color: #52636b; font-size: 10px; }
    .dimension-info summary { cursor: pointer; color: #326f70; }
    .dimension-info-body { padding: 6px 0 2px; }
    .dimension-group { margin: 5px 0 8px; }
    .dimension-match-list { margin: 4px 0 0; padding-left: 15px; }
    .dimension-match-list li { margin: 3px 0; line-height: 1.45; overflow-wrap: anywhere; }
    .chunk-dialog { width: min(820px, calc(100vw - 28px)); max-height: min(82vh, 900px); padding: 0; border: 1px solid var(--line); border-radius: 14px; color: var(--ink); box-shadow: 0 20px 70px rgba(12, 31, 41, .28); }
    .chunk-dialog::backdrop { background: rgba(13, 30, 39, .58); }
    .chunk-dialog-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 15px; padding: 17px 19px 12px; border-bottom: 1px solid var(--line); }
    .chunk-dialog-title { margin: 0; font-size: 17px; line-height: 1.45; overflow-wrap: anywhere; }
    .chunk-dialog-meta { padding: 10px 19px 0; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    .chunk-content { margin: 0; padding: 16px 19px 20px; max-height: 62vh; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.75 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .chunk-hint { color: var(--teal); }
    .score-line { margin-top: 4px; font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .cutline { margin: 9px 4px 7px; padding-top: 6px; border-top: 1px dashed #d3dce0; color: #8a969d; font-size: 10px; text-align: center; }
    .empty { padding: 35px 15px; text-align: center; color: var(--muted); }
    .detail-foot { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 13px; color: var(--muted); font-size: 11px; }
    .legend-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; background: #d39a2f; }
    .legend-bar { display: inline-block; width: 3px; height: 11px; margin: 0 6px -2px 0; background: var(--red); }
    .error { max-width: 750px; margin: 50px auto; background: white; border: 1px solid #efc9c2; border-radius: 12px; padding: 22px; color: #783535; }
    .error code { color: #542d2d; }
    @media (max-width: 1250px) { .metrics { grid-template-columns: repeat(3, 1fr); } .routes { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); } }
    @media (max-width: 760px) { .topbar-inner { align-items: flex-start; flex-direction: column; } .metrics { grid-template-columns: repeat(2, 1fr); } .layout { grid-template-columns: 1fr; } .list-panel { position: static; max-height: 300px; } .detail { padding: 13px; } .detail-top { flex-direction: column; } .navigation { width: 100%; } .question-title { font-size: 17px; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div><h1>景区检索与融合对比</h1><div class="subtitle" id="subtitle">语义、维度与融合检索结果对比；点击 chunk 编号查看正文。</div></div>
      <div class="local-badge">本地静态数据 · 不请求模型或外部 API</div>
    </div>
  </header>
  <main class="page" id="app">
    <section class="metrics" id="metrics"></section>
    <section class="toolbar">
      <label class="search"><input id="search" type="search" placeholder="搜索问题、ID 或 chunk ID…" autocomplete="off"></label>
      <select id="filter" aria-label="筛选问题">
        <option value="all">全部问题</option>
        <option value="baseline-miss">加权基线 Top-5 未命中</option>
        <option value="deepseek-miss">DeepSeek Top-5 未命中</option>
        <option value="answerability-miss">Answerability Top-5 未命中</option>
        <option value="semantic-miss">语义 Top-5 未命中</option>
        <option value="dimension-miss">维度 Top-5 未命中</option>
        <option value="both">语义与维度 Top-5 都命中</option>
      </select>
      <button class="button" id="show-all">展开全部候选</button>
    </section>
    <section class="layout">
      <aside class="panel list-panel">
        <div class="list-heading"><strong>问答列表</strong><span id="list-count"></span></div>
        <div class="question-list" id="question-list"></div>
      </aside>
      <article class="panel detail" id="detail"><div class="empty">正在读取本地检索结果…</div></article>
    </section>
  </main>
  <dialog class="chunk-dialog" id="chunk-dialog" aria-labelledby="chunk-dialog-title">
    <div class="chunk-dialog-head">
      <h2 class="chunk-dialog-title" id="chunk-dialog-title">Chunk 正文</h2>
      <button class="button" id="chunk-dialog-close" type="button" aria-label="关闭">关闭</button>
    </div>
    <div class="chunk-dialog-meta" id="chunk-dialog-meta"></div>
    <pre class="chunk-content" id="chunk-content"></pre>
  </dialog>
  <script>
    const $ = (selector) => document.querySelector(selector);
    let rows = [];
    let filtered = [];
    let activeIndex = 0;
    let showAll = false;
    let chunkContents = null;
    let chunkContentsPromise = null;
    let chunkDimensionTags = {};

    const routeStats = [
      ['semantic_results', '语义 Top-5 命中', 'semHit'],
      ['dimension_results', '维度 Top-5 命中', 'dimHit'],
      ['baseline_results', '加权基线 Top-5 命中', 'baselineHit'],
      ['deepseek_results', 'DeepSeek Top-5 命中', 'deepseekHit'],
      ['answerability_results', 'Answerability Top-5 命中', 'answerabilityHit'],
    ];
    function hasRoute(key) { return rows.some(row => Array.isArray(row[key]) && row[key].length > 0); }

    function rankMap(ids) { return Object.fromEntries((ids || []).map((id, index) => [id, index + 1])); }
    function top5(ids) { return new Set((ids || []).slice(0, 5)); }
    function rowState(row) {
      const gold = new Set(row.gold_chunk_ids || []);
      const sem5 = top5((row.semantic_results || []).map(x => x.chunk_id));
      const dim5 = top5((row.dimension_results || []).map(x => x.chunk_id));
      const baseline5 = top5((row.baseline_results || []).map(x => x.chunk_id));
      const deepseek5 = top5((row.deepseek_results || []).map(x => x.chunk_id));
      const answerability5 = top5((row.answerability_results || []).map(x => x.chunk_id));
      const semHit = [...gold].some(id => sem5.has(id));
      const dimHit = [...gold].some(id => dim5.has(id));
      const baselineHit = [...gold].some(id => baseline5.has(id));
      const deepseekHit = [...gold].some(id => deepseek5.has(id));
      const answerabilityHit = [...gold].some(id => answerability5.has(id));
      return { gold, evaluated: gold.size > 0, sem5, dim5, baseline5, deepseek5, answerability5, semHit, dimHit, baselineHit, deepseekHit, answerabilityHit };
    }
    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined && text !== null) node.textContent = String(text);
      return node;
    }
    function metric(label, value, warn = false) {
      const box = el('div', 'metric');
      box.append(el('div', 'metric-label', label), el('div', `metric-value${warn ? ' warn' : ''}`, value));
      return box;
    }
    function renderMetrics() {
      const stats = rows.map(rowState).filter(s => s.evaluated);
      if (!stats.length) {
        const boxes = [metric('检索快照', rows.length), metric('Gold 评测', '未提供')];
        $('#metrics').replaceChildren(...boxes);
        return;
      }
      const count = (key) => stats.filter(s => s[key]).length;
      const boxes = [metric('Gold 评测问答量', `${stats.length} / ${rows.length}`)];
      routeStats.filter(([key]) => hasRoute(key)).forEach(([, label, stateKey]) => {
        boxes.push(metric(label, `${count(stateKey)} / ${stats.length}`));
      });
      $('#metrics').replaceChildren(...boxes);
    }
    function passes(row, value) {
      const s = rowState(row);
      if (!s.evaluated && value !== 'all') return false;
      if (value === 'baseline-miss') return !s.baselineHit;
      if (value === 'deepseek-miss') return !s.deepseekHit;
      if (value === 'answerability-miss') return !s.answerabilityHit;
      if (value === 'semantic-miss') return !s.semHit;
      if (value === 'dimension-miss') return !s.dimHit;
      if (value === 'both') return s.semHit && s.dimHit;
      return true;
    }
    function applyFilters() {
      const query = $('#search').value.trim().toLocaleLowerCase();
      const type = $('#filter').value;
      filtered = rows.filter(row => {
        const candidateIds = ['semantic_results', 'dimension_results', 'baseline_results', 'deepseek_results', 'answerability_results']
          .flatMap(key => (row[key] || []).map(item => item.chunk_id));
        const haystack = [row.id, row.dataset_index, row.question, row.retrieval_query, ...(row.gold_chunk_ids || []), ...candidateIds].join(' ').toLocaleLowerCase();
        return (!query || haystack.includes(query)) && passes(row, type);
      });
      if (activeIndex >= filtered.length) activeIndex = Math.max(0, filtered.length - 1);
      renderList();
      renderDetail();
    }
    function renderList() {
      $('#list-count').textContent = `${filtered.length} / ${rows.length}`;
      const list = $('#question-list');
      const nodes = filtered.map((row, index) => {
        const s = rowState(row);
        const button = el('button', `question-item${index === activeIndex ? ' active' : ''}`);
        button.type = 'button';
        const title = el('div', 'question-item-title', row.question || '(空问题)');
        const meta = el('div', 'question-item-meta');
        meta.append(el('span', '', `#${row.dataset_index ?? row.id ?? index + 1}`));
        const status = !s.evaluated
          ? { evaluated: false, label: 'Fusion snapshot' }
          : hasRoute('answerability_results')
          ? { hit: s.answerabilityHit, label: 'Answerability' }
          : { hit: s.baselineHit, label: '融合基线' };
        meta.append(el('span', `mini-state ${status.evaluated === false ? 'unrated' : status.hit ? 'hit' : 'lost'}`, status.evaluated === false ? status.label : `${status.label} ${status.hit ? '命中' : '未命中'}`));
        button.append(title, meta);
        button.addEventListener('click', () => { activeIndex = index; renderList(); renderDetail(); });
        return button;
      });
      list.replaceChildren(...nodes);
      if (!filtered.length) list.append(el('div', 'empty', '没有符合条件的问题'));
    }
    function fmtScore(value) { return typeof value === 'number' ? Number(value).toFixed(4) : null; }
    function renderQuestionDimensions(row) {
      const panel = el('section', 'question-dimensions');
      panel.append(el('h3', 'dimension-panel-title', '问题维度标签'));
      const dimensions = row.query_dimensions || [];
      if (!dimensions.length) {
        panel.append(el('div', 'dimension-note', '当前数据没有保存该问题的维度解析。'));
        return panel;
      }
      const grid = el('div', 'query-dimension-grid');
      dimensions.forEach(dimension => {
        const group = el('div', 'query-dimension');
        const title = el('div', 'dimension-group-title');
        title.append(el('span', '', dimension.dimension_name || dimension.dimension_id));
        if (dimension.dimension_path && dimension.dimension_path !== dimension.dimension_name) {
          title.append(el('span', 'dimension-path', dimension.dimension_path));
        }
        title.append(el('span', 'dimension-role', `角色 ${dimension.role || 'auxiliary'}`));
        group.append(title);
        const chips = el('div', 'dimension-tags');
        (dimension.labels || []).forEach(label => chips.append(el('span', 'dimension-chip', label)));
        (dimension.intent_terms || []).forEach(term => chips.append(el('span', 'dimension-chip intent', `意图词：${term}`)));
        if (!chips.childNodes.length) chips.append(el('span', 'dimension-note', '无标签或意图词'));
        group.append(chips);
        group.append(el('div', 'dimension-note', `匹配模式 ${dimension.match || 'ANY'} · 问题侧未提供标签独立得分`));
        grid.append(group);
      });
      panel.append(grid);
      return panel;
    }
    function matchSourceLabel(source) {
      return ({ canonical_label: '标签匹配', intent_text: '意图词命中正文', dimension_vector: '维度向量匹配' })[source] || source || '—';
    }
    function renderDimensionInfo(item, chunkId) {
      const chunk = chunkDimensionTags[chunkId] || {};
      const dimensions = chunk.dimensions || [];
      const matches = item?.matches || [];
      const tagCount = dimensions.reduce((sum, dimension) => sum + (dimension.labels || []).length, 0);
      if (!tagCount && !matches.length) return null;
      const wrapper = el('div', 'dimension-card-info');
      const preview = el('div', 'dimension-preview');
      const previewTags = dimensions.flatMap(dimension => (dimension.labels || []).map(tag => ({ dimension, tag }))).slice(0, 3);
      previewTags.forEach(({ dimension, tag }) => {
        const chip = el('span', 'dimension-chip');
        chip.append(document.createTextNode(`${dimension.dimension_name || dimension.dimension_id}：${tag.label || ''}`));
        if (typeof tag.confidence === 'number') {
          chip.append(el('span', 'dimension-chip-score', `置信 ${fmtScore(tag.confidence)}`));
        }
        const labelMatch = matches.find(match => match.dimension_id === dimension.dimension_id && match.label === tag.label);
        if (labelMatch && typeof labelMatch.similarity === 'number') {
          chip.append(el('span', 'dimension-chip-score', `匹配 ${fmtScore(labelMatch.similarity)}`));
        }
        preview.append(chip);
      });
      if (tagCount > previewTags.length) preview.append(el('span', 'dimension-note', `+${tagCount - previewTags.length} 个标签`));
      if (preview.childNodes.length) wrapper.append(preview);
      const details = el('details', 'dimension-info');
      details.append(el('summary', '', `查看完整标签及匹配分（${tagCount} 个标签 · ${matches.length} 条匹配）`));
      const body = el('div', 'dimension-info-body');
      if (dimensions.length) {
        dimensions.forEach(dimension => {
          const group = el('div', 'dimension-group');
          const heading = el('div', 'dimension-group-title');
          heading.append(el('span', '', dimension.dimension_name || dimension.dimension_id));
          if (dimension.dimension_path && dimension.dimension_path !== dimension.dimension_name) {
            heading.append(el('span', 'dimension-path', dimension.dimension_path));
          }
          group.append(heading);
          const chips = el('div', 'dimension-tags');
          (dimension.labels || []).forEach(tag => {
            const chip = el('span', 'dimension-chip');
            chip.append(document.createTextNode(tag.label || ''));
            if (typeof tag.confidence === 'number') {
              chip.append(el('span', 'dimension-chip-score', `置信度 ${fmtScore(tag.confidence)}`));
            }
            chips.append(chip);
          });
          group.append(chips);
          body.append(group);
        });
      } else {
        body.append(el('div', 'dimension-note', '标签数据中未找到该 chunk 的维度标签。'));
      }
      if (matches.length) {
        body.append(el('div', 'dimension-group-title', '问题约束匹配分（来自检索 matches）'));
        const list = el('ul', 'dimension-match-list');
        matches.forEach(match => {
          const line = document.createElement('li');
          const label = [match.dimension_path || match.dimension_id, match.label].filter(Boolean).join(' · ');
          const scoreBits = [];
          if (typeof match.similarity === 'number') scoreBits.push(`相似度 ${fmtScore(match.similarity)}`);
          if (typeof match.idf_bonus === 'number') scoreBits.push(`IDF 加权 ${fmtScore(match.idf_bonus)}`);
          if (match.role) scoreBits.push(`角色 ${match.role}`);
          scoreBits.push(matchSourceLabel(match.source));
          line.append(document.createTextNode(`${label} — ${scoreBits.join(' · ')}`));
          if (match.evidence) line.title = match.evidence;
          list.append(line);
        });
        body.append(list);
      }
      details.append(body);
      wrapper.append(details);
      return wrapper;
    }
    function routeData(row) {
      const definitions = [
        ['semantic', '语义检索', '相似度排序', row.semantic_results || []],
        ['dimension', '维度检索', '维度匹配排序', row.dimension_results || []],
        ['baseline', '加权基线融合', '基线候选池与加权排序', row.baseline_results || []],
        ['deepseek', 'DeepSeek Listwise', '同一候选池 · Listwise 重排', row.deepseek_results || []],
        ['answerability', 'Answerability Rerank', '同一候选池 · 可回答性重排', row.answerability_results || []],
      ];
      return definitions.filter(([key]) => hasRoute(`${key}_results`)).map(([key, title, description, items]) => ({
        key, title,
        sub: `${items.length} 个候选 · ${description}`,
        ids: items.map(item => item.chunk_id),
        meta: Object.fromEntries(items.map(item => [item.chunk_id, item])),
      }));
    }
    function routeScore(route, item) {
      if (!item) return '';
      const bits = [];
      if (route.key === 'semantic') {
        const score = fmtScore(item.normalized_semantic_score ?? item.semantic_score ?? item.score);
        if (score !== null) bits.push(`语义分 ${score}`);
      } else if (route.key === 'dimension') {
        const score = fmtScore(item.normalized_dimension_score ?? item.dimension_score ?? item.score);
        if (score !== null) bits.push(`维度分 ${score}`);
      } else if (route.key === 'baseline') {
        const score = fmtScore(item.fused_score ?? item.final_score ?? item.score ?? item.base_score);
        if (score !== null) bits.push(`融合分 ${score}`);
        if (item.normalized_semantic_score != null) bits.push(`语义 ${fmtScore(item.normalized_semantic_score)}`);
        if (item.normalized_dimension_score != null) bits.push(`维度 ${fmtScore(item.normalized_dimension_score)}`);
      } else if (route.key === 'deepseek') {
        if (item.rerank_score != null) bits.push(`重排分 ${fmtScore(item.rerank_score)}`);
        if (item.base_score != null) bits.push(`基线分 ${fmtScore(item.base_score)}`);
        if (item.semantic_rank != null) bits.push(`原语义名次 ${item.semantic_rank}`);
        if (item.dimension_rank != null) bits.push(`原维度名次 ${item.dimension_rank}`);
      } else if (route.key === 'answerability') {
        if (item.answerability != null) bits.push(`可回答性 ${fmtScore(item.answerability)}`);
        if (item.quality_score != null) bits.push(`质量 ${fmtScore(item.quality_score)}`);
        if (item.rerank_score != null) bits.push(`重排分 ${fmtScore(item.rerank_score)}`);
      }
      return bits.join(' · ');
    }
    async function loadChunkContents() {
      if (chunkContents) return chunkContents;
      if (!chunkContentsPromise) {
        chunkContentsPromise = fetch('./rerank_chunk_contents.json', { cache: 'no-store' })
          .then(response => {
            if (!response.ok) throw new Error(`读取景区数据集 chunk 正文失败（HTTP ${response.status}）`);
            return response.json();
          }).then(contents => {
            chunkContents = contents;
            return chunkContents;
        }).catch(error => {
          chunkContentsPromise = null;
          throw error;
        });
      }
      return chunkContentsPromise;
    }
    async function showChunk(chunkId, routeTitle, rank) {
      const dialog = $('#chunk-dialog');
      $('#chunk-dialog-title').textContent = chunkId;
      $('#chunk-dialog-meta').textContent = `${routeTitle} · 排名 #${rank} · 正在读取正文…`;
      $('#chunk-content').textContent = '加载中…';
      if (!dialog.open) dialog.showModal();
      try {
        const contents = await loadChunkContents();
        const chunk = contents[chunkId];
        if (!chunk) {
          $('#chunk-dialog-meta').textContent = `${routeTitle} · 排名 #${rank}`;
          $('#chunk-content').textContent = '静态 chunk 正文数据中没有找到这个编号。';
          return;
        }
        const source = [chunk.title, chunk.source_file].filter(Boolean).join(' · ');
        $('#chunk-dialog-meta').textContent = `${routeTitle} · 排名 #${rank}${source ? ` · ${source}` : ''}`;
        $('#chunk-content').textContent = chunk.text || '该 chunk 没有可显示的正文。';
      } catch (error) {
        $('#chunk-dialog-meta').textContent = `${routeTitle} · 排名 #${rank}`;
        $('#chunk-content').textContent = `${error.message}。请确认静态服务器提供了景区数据集对应的 rerank_chunk_contents.json。`;
      }
    }
    function renderRoute(row, route, state) {
      const box = el('section', 'route');
      const head = el('div', 'route-head');
      head.append(el('div', 'route-title', route.title), el('div', 'route-sub', route.sub));
      box.append(head);
      const list = el('div', 'route-list');
      const ids = route.ids || [];
      const visible = showAll ? ids : ids.slice(0, 5);
      const meta = route.meta || {};
      visible.forEach((chunkId, index) => {
        const rank = index + 1;
        const item = meta[chunkId];
        const isGold = state.gold.has(chunkId);
        const card = el('div', `candidate${isGold ? ' is-gold' : ''}`);
        card.dataset.chunkId = chunkId;
        card.addEventListener('mouseenter', () => {
          document.querySelectorAll('.candidate[data-chunk-id]').forEach(candidate => {
            candidate.classList.toggle('is-linked-hover', candidate.dataset.chunkId === chunkId);
          });
        });
        card.addEventListener('mouseleave', () => {
          document.querySelectorAll('.candidate.is-linked-hover').forEach(candidate => {
            candidate.classList.remove('is-linked-hover');
          });
        });
        const top = el('div', 'candidate-top');
        top.append(el('span', 'rank', `#${rank}`));
        const flags = el('span', 'candidate-flags');
        if (isGold) flags.append(el('span', 'flag gold', 'GOLDEN'));
        top.append(flags);
        const chunkButton = el('button', 'chunk-id chunk-link', chunkId);
        chunkButton.type = 'button';
        chunkButton.title = '点击查看 chunk 完整内容';
        chunkButton.addEventListener('click', () => showChunk(chunkId, route.title, rank));
        card.append(top, chunkButton);
        const scoreText = routeScore(route, item);
        if (scoreText) card.append(el('div', 'score-line', scoreText));
        if (route.key === 'dimension') {
          const dimensionInfo = renderDimensionInfo(item, chunkId);
          if (dimensionInfo) card.append(dimensionInfo);
        }
        list.append(card);
        if (rank === 5 && ids.length > 5 && !showAll) list.append(el('div', 'cutline', `Top-5 截止线 · 后续 ${ids.length - 5} 个`));
      });
      if (!visible.length) list.append(el('div', 'empty', '该路由没有候选'));
      box.append(list);
      return box;
    }
    function renderDetail() {
      const root = $('#detail');
      const row = filtered[activeIndex];
      if (!row) { root.replaceChildren(el('div', 'empty', '没有符合条件的问题')); return; }
      const state = rowState(row);
      const head = el('div', 'detail-top');
      const intro = document.createElement('div');
      intro.append(el('h2', 'question-title', row.question || '(空问题)'));
      intro.append(el('div', 'query-line', `${row.source_type === 'fusion_engine' ? 'Fusion 快照' : '数据集行'} ${row.dataset_index ?? '—'} · ID ${row.id || '—'}${row.retrieval_query ? ` · 检索 query：${row.retrieval_query}` : ''}${row.created_at ? ` · ${row.created_at}` : ''}`));
      const nav = el('div', 'navigation');
      const prev = el('button', 'button', '← 上一题'); prev.type = 'button'; prev.disabled = activeIndex <= 0;
      prev.addEventListener('click', () => { activeIndex--; renderList(); renderDetail(); });
      const next = el('button', 'button primary', '下一题 →'); next.type = 'button'; next.disabled = activeIndex >= filtered.length - 1;
      next.addEventListener('click', () => { activeIndex++; renderList(); renderDetail(); });
      nav.append(prev, next); head.append(intro, nav);
      const badges = el('div', 'badges');
      routeStats.filter(([key]) => hasRoute(key)).forEach(([, label, stateKey]) => {
        const shortLabel = label.replace(' 命中', '');
        const result = state.evaluated ? (state[stateKey] ? '命中' : '未命中') : '未评测';
        badges.append(el('span', `badge${state.evaluated ? (state[stateKey] ? ' hit' : ' miss') : ''}`, `${shortLabel} ${result}`));
      });
      badges.append(el('span', `badge${state.evaluated ? ' gold' : ''}`, state.evaluated ? `Golden ${state.gold.size} 个` : 'Gold 未提供'));
      const queryDimensions = renderQuestionDimensions(row);
      const routes = el('div', 'routes');
      routeData(row).forEach(route => routes.append(renderRoute(row, route, state)));
      const foot = el('div', 'detail-foot');
      foot.append(el('span', 'chunk-hint', '点击任意 chunk 编号可查看完整内容。'));
      foot.append(el('span', '', row.source_type === 'fusion_engine'
        ? '候选来自 fusion_engine 输出快照；本页不触发检索请求。'
        : '候选来自离线评测 JSONL；本页不触发检索请求。'));
      if (state.evaluated) {
        const goldLegend = el('span', ''); goldLegend.append(el('i', 'legend-dot'), document.createTextNode('Golden chunk'));
        foot.append(goldLegend);
      }
      root.replaceChildren(head, badges, queryDimensions, routes, foot);
    }
    function setShowAll() {
      showAll = !showAll;
      $('#show-all').textContent = showAll ? '仅显示 Top-5' : '展开全部候选';
      renderDetail();
    }
    async function start() {
      try {
        const response = await fetch('./fusion_routes.json', { cache: 'no-store' });
        if (!response.ok) throw new Error(`读取景区检索结果 fusion_routes.json 失败（HTTP ${response.status}）`);
        const sourceRows = await response.json();
        if (!Array.isArray(sourceRows) || !sourceRows.length) throw new Error('fusion_routes.json 为空或格式不正确');
        rows = sourceRows.map((row, index) => {
          if (Number(row.dataset_index) !== index + 1) throw new Error(`第 ${index + 1} 行数据集编号错位`);
          const routeKeys = ['semantic_results', 'dimension_results', 'baseline_results', 'deepseek_results', 'answerability_results'];
          if (!Array.isArray(row.gold_chunk_ids) || routeKeys.some(key => !Array.isArray(row[key]))) {
            throw new Error(`第 ${index + 1} 行缺少 Golden 或景区数据集检索路线结果`);
          }
          return row;
        });
        const tagResponse = await fetch('./chunk_dimension_tags.json', { cache: 'no-store' });
        if (!tagResponse.ok) throw new Error(`读取 chunk 维度标签 chunk_dimension_tags.json 失败（HTTP ${tagResponse.status}）`);
        chunkDimensionTags = await tagResponse.json();
        if (!chunkDimensionTags || typeof chunkDimensionTags !== 'object' || Array.isArray(chunkDimensionTags)) {
          throw new Error('chunk_dimension_tags.json 格式不正确');
        }
        if (!Array.isArray(rows) || !rows.length) throw new Error('fusion_routes.json 为空或格式不正确');
        const rerankAvailable = hasRoute('deepseek_results') || hasRoute('answerability_results');
        const fusionSnapshots = rows.some(row => row.source_type === 'fusion_engine');
        $('#subtitle').textContent = fusionSnapshots
          ? '数据直接来自 fusion_engine 检索快照；快照不含 Gold 标注，因此不计算命中率。点击 chunk 编号查看正文。'
          : rerankAvailable
            ? '语义、维度与融合检索对比，包含当前数据提供的 rerank 路线；点击 chunk 编号查看正文。'
            : '语义、维度与融合检索对比；当前原始数据未提供 rerank 结果。点击 chunk 编号查看正文。';
        const unavailableFilters = {
          'baseline-miss': 'baseline_results',
          'deepseek-miss': 'deepseek_results',
          'answerability-miss': 'answerability_results',
          'semantic-miss': 'semantic_results',
          'dimension-miss': 'dimension_results',
        };
        [...$('#filter').options].forEach(option => {
          const routeKey = unavailableFilters[option.value];
          if (routeKey) option.disabled = !hasRoute(routeKey) || !rows.some(row => (row.gold_chunk_ids || []).length > 0);
          if (option.value === 'both') option.disabled = !rows.some(row => (row.gold_chunk_ids || []).length > 0);
        });
        renderMetrics();
        $('#search').addEventListener('input', applyFilters);
        $('#filter').addEventListener('change', applyFilters);
        $('#show-all').addEventListener('click', setShowAll);
        $('#chunk-dialog-close').addEventListener('click', () => $('#chunk-dialog').close());
        applyFilters();
      } catch (error) {
        const box = el('div', 'error');
        box.append(el('h2', '', '未能加载可视化数据'), el('p', '', error.message));
        box.append(el('p', '', '请确认当前目录包含 fusion_routes.json 和 rerank_chunk_contents.json，然后刷新本页。'));
        $('#app').replaceChildren(box);
      }
    }
    start();
  </script>
</body>
</html>
