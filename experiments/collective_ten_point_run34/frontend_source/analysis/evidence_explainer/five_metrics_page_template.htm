<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旅游问答评价</title>
<style>/*ORIGINAL_STYLES*/
.app{gap:0;min-height:0;height:100dvh}.prompts{resize:none;max-height:none;min-height:110px;height:260px}.workspace{min-height:180px}.splitter{height:16px;flex:0 0 16px;cursor:row-resize;touch-action:none;display:grid;place-items:center;outline:none;user-select:none}.splitter:before{content:"";width:64px;height:4px;border-radius:4px;background:#b7c9bf}.splitter:hover:before,.splitter:focus-visible:before{background:#116b58}.splitter:focus-visible{box-shadow:inset 0 0 0 2px #8bd0b9;border-radius:4px}body.dragging,body.dragging *{cursor:row-resize!important;user-select:none!important}.prompts.collapsed{min-height:53px;height:53px!important}.single-answer{margin-bottom:20px}.single-answer .prose{padding:15px 17px;max-height:none}.basis-grid.single{grid-template-columns:1fr}.type-badge{max-width:80%;overflow-wrap:anywhere}.summary-strip{font-size:12px;color:#71807b}.prompt-content{white-space:pre-wrap}.no-result{padding:28px;color:#71807b}.final-basis .check-basis{white-space:pre-wrap}.prompt-header h1{max-width:42%;overflow:hidden;text-overflow:ellipsis}.answer-grid .prose{white-space:pre-wrap}
@media(max-width:760px){body{overflow:hidden}.app{height:100dvh;min-height:0;padding:8px}.prompts{min-height:110px;max-height:none;resize:none}.workspace{min-height:180px;display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px}.sidebar{height:auto;min-height:0}.detail{overflow:auto;min-height:0;padding:14px}.prompt-header h1{max-width:80%}.prompts.collapsed{min-height:88px;height:88px!important}.answer-grid{grid-template-columns:1fr}.scores th,.scores td{padding:8px}.question-title{font-size:17px}.question-item{font-size:12px}.basis-grid{grid-template-columns:1fr}}
</style></head><body>
<div class="app" id="app"><section class="prompts" id="prompts" aria-label="各阶段提示"><div class="prompt-header"><h1 id="page-title"></h1><div class="prompt-tabs"><select id="stage" aria-label="选择阶段提示"></select></div><button class="quiet" id="collapse" aria-expanded="true">收起</button></div><div class="prompt-panel"><pre class="prompt-content" id="prompt-text" tabindex="0"></pre></div></section>
<div id="splitter" class="splitter" role="separator" tabindex="0" aria-label="拖动调整提示区与问题区高度" aria-orientation="horizontal" aria-controls="prompts workspace" aria-valuemin="110" aria-valuemax="600" aria-valuenow="260" title="上下拖动调整大小；方向键微调，双击恢复"></div>
<main class="workspace" id="workspace"><aside class="sidebar"><div class="sidebar-header"><h2>问题</h2><span class="count" id="count"></span></div><div class="search-box"><input id="search" type="search" aria-label="搜索问题" placeholder="搜索问题"></div><nav class="question-list" id="list" aria-label="全部问题"></nav></aside><article class="detail" id="detail" aria-label="问题详情"></article></main></div>
<script>
'use strict';
const DATA=/*RESULT_DATA*/;
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val=v=>typeof v==='number'?(DATA.integerScale?String(v):v.toFixed(2)):'N/A';
const names={bare:'裸q＋top5',collective:'q＋群智＋top5'};
const quality=(r,g)=>{const s=r.groups[g]?.llm_scores;const x=['factual_accuracy','context_faithfulness','question_completeness'].map(d=>s?.[d]);return x.every(v=>typeof v==='number')?x.reduce((a,b)=>a+b,0)/3:null};
const rows=[...DATA.rows].sort((a,b)=>{
 const x=quality(a,'collective'),y=quality(b,'collective');
 if(a.groups.bare&&b.groups.bare){const u=quality(a,'bare'),v=quality(b,'bare');if([x,y,u,v].every(n=>typeof n==='number'))return (x-u)-(y-v)||x-y;}
 return (x??Infinity)-(y??Infinity);
});
let selected=0;
$('page-title').textContent=DATA.title;$('stage').innerHTML=DATA.prompts.map((p,i)=>`<option value="${i}">${esc(p.label)}</option>`).join('');
function stage(){const p=DATA.prompts[Number($('stage').value)];$('prompt-text').textContent=p?.text??'阶段提示尚未生成';}
$('stage').addEventListener('change',stage);stage();
function list(){const term=$('search').value.trim().toLowerCase();let n=0;$('list').innerHTML=rows.map((r,i)=>{if(term&&!r.question.toLowerCase().includes(term))return '';n++;return `<button class="question-item" data-index="${i}" aria-current="${i===selected}"><span class="question-number">${String(i+1).padStart(3,'0')}</span><span class="question-label">${esc(r.question)}</span></button>`}).join('');$('count').textContent=term?`${n}/${rows.length}`:String(rows.length);}
function render(){const r=rows[selected];if(!r){$('detail').innerHTML='<div class="no-result">实验运行中，最终答案尚未收集。</div>';return;}
 const groups=Object.keys(r.groups),single=groups.length===1;
 $('detail').innerHTML=`<div class="detail-top"><span class="type-badge">${esc(r.question_type_name)}</span><span class="summary-strip">${selected+1} / ${rows.length}</span></div><h2 class="question-title">${esc(r.question)}</h2><section class="reference"><h3 class="section-label">参考答案</h3><div class="prose">${esc(r.reference_answer)}</div></section><div class="${single?'single-answer':'answer-grid'}">${groups.map(g=>`<section class="answer ${g}"><h3 class="answer-heading">${names[g]}</h3><div class="prose" data-answer="${g}">${esc(r.groups[g].answer??'未取得有效答案')}</div></section>`).join('')}</div><section class="scores-section"><h3 class="section-label">最终LLM评分 · 0–100 · DeepSeek-V4-Pro</h3><table class="scores"><thead><tr><th>指标</th>${groups.map(g=>`<th>${names[g]}</th>`).join('')}</tr></thead><tbody>${DATA.dims.map(([d,label])=>`<tr><th>${label}</th>${groups.map(g=>`<td data-score="${g}-${d}">${val(r.groups[g].llm_scores[d])}</td>`).join('')}</tr>`).join('')}</tbody></table></section><section><h3 class="section-label">最终评分依据</h3><div class="basis-grid ${single?'single':''}">${groups.map(g=>`<section class="basis-method ${g}" data-basis="${g}"><h3 class="answer-heading">${names[g]}</h3>${DATA.dims.map(([d,label],i)=>`<details class="final-basis" ${i===0?'open':''}><summary><span>${label}</span><span>${val(r.groups[g].llm_scores[d])}</span></summary><div class="check-basis">${esc(r.groups[g].score_basis[d])}</div></details>`).join('')}</section>`).join('')}</div></section><section style="margin-top:24px"><h3 class="section-label">实际使用的top5上下文</h3><div class="contexts">${r.actual_top5.map((d,i)=>`<details class="context" ${i===0?'open':''}><summary><span class="context-rank">TOP ${i+1}</span><span>${esc(d.doc_title??d.title??'')}</span></summary><div class="prose">${esc(d.text)}</div></details>`).join('')}</div></section>`;
 const scoreTitle=$('detail').querySelector('.scores-section .section-label');if(scoreTitle&&DATA.scoreHeading)scoreTitle.textContent=DATA.scoreHeading;
 if(DATA.integerScale){const preference=v=>v===1?'生成答案':v===-1?'参考答案':v===0?'无法判断':'N/A';$('detail').querySelectorAll('[data-score$="-answer_preference"]').forEach(cell=>{cell.textContent=cell.textContent==='N/A'?'N/A':preference(Number(cell.textContent));});const index=DATA.dims.findIndex(([key])=>key==='answer_preference');if(index>=0)$('detail').querySelectorAll('.basis-method').forEach(section=>{const cell=section.querySelectorAll('.final-basis')[index]?.querySelector('summary > span:last-child');if(cell)cell.textContent=cell.textContent==='N/A'?'N/A':preference(Number(cell.textContent));});}
 $('detail').scrollTop=0;
}
$('search').addEventListener('input',list);$('list').addEventListener('click',e=>{const b=e.target.closest('[data-index]');if(!b)return;selected=Number(b.dataset.index);list();render();history.replaceState(null,'','#q='+encodeURIComponent(rows[selected].id));});
const initial=new URLSearchParams(location.hash.slice(1)).get('q'),found=rows.findIndex(r=>r.id===initial);if(found>=0)selected=found;list();render();
const handle=$('splitter'),panel=$('prompts'),app=$('app');let savedHeight=260,drag=null;
function limits(){return {min:110,max:Math.max(110,app.clientHeight-230)}}
function resize(h,persist=true){const {min,max}=limits();savedHeight=Math.min(max,Math.max(min,h));panel.style.height=savedHeight+'px';handle.setAttribute('aria-valuemin',String(min));handle.setAttribute('aria-valuemax',String(max));handle.setAttribute('aria-valuenow',String(Math.round(savedHeight)));if(persist)try{localStorage.setItem('scenic-split-height',String(savedHeight))}catch{}}
try{const h=Number(localStorage.getItem('scenic-split-height'));if(h>0)savedHeight=h}catch{}resize(savedHeight,false);
function expand(){panel.classList.remove('collapsed');$('collapse').textContent='收起';$('collapse').setAttribute('aria-expanded','true');}
handle.addEventListener('pointerdown',e=>{if(e.button!==0)return;expand();drag={y:e.clientY,height:panel.getBoundingClientRect().height};handle.setPointerCapture(e.pointerId);document.body.classList.add('dragging');e.preventDefault();});
handle.addEventListener('pointermove',e=>{if(drag)resize(drag.height+e.clientY-drag.y)});
function end(){drag=null;document.body.classList.remove('dragging')}
handle.addEventListener('pointerup',end);handle.addEventListener('pointercancel',end);handle.addEventListener('lostpointercapture',end);
handle.addEventListener('keydown',e=>{if(!['ArrowUp','ArrowDown','Home','End'].includes(e.key))return;e.preventDefault();expand();const l=limits();resize(e.key==='Home'?l.min:e.key==='End'?l.max:savedHeight+(e.key==='ArrowUp'?-20:20));});
handle.addEventListener('dblclick',()=>{expand();resize(260)});window.addEventListener('resize',()=>resize(savedHeight,false));
$('collapse').addEventListener('click',()=>{const collapsed=panel.classList.toggle('collapsed');$('collapse').textContent=collapsed?'展开':'收起';$('collapse').setAttribute('aria-expanded',String(!collapsed));if(!collapsed)resize(savedHeight,false)});
</script></body></html>
